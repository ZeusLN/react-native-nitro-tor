name: Build Prebuilts (ZeusLN fork)

on:
  workflow_dispatch:
  push:
    branches:
      - prebuilt-artifacts

jobs:
  # Single macos job — Apple Silicon runner can host both iOS and Android
  # cross-compiles (NDK ships an x86_64 toolchain that runs fine via Rosetta).
  # `yarn craby build` walks all 7 targets in one shot.
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install autotools (libtor / openssl-src vendored build deps)
        # macos-latest doesn't ship automake / autoconf / libtool / pkg-config,
        # but libtor-src's autogen.sh runs aclocal in its build script.
        run: brew install automake autoconf libtool pkg-config

      - name: Install Rust cross targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Set up NDK shims and Android cross-compile env
        # 1) NDK 23+ ships unified `llvm-ar` / `llvm-ranlib` etc., but the
        #    vendored openssl autotools build inside libtor-sys still calls
        #    the legacy per-arch names (e.g. `aarch64-linux-android-ranlib`).
        #    Synthesize the wrappers via symlinks and prepend to PATH.
        # 2) Set CC/CXX/AR/RANLIB/linker env vars per Android target so the
        #    `cc` crate (libz-sys, openssl-src, etc.) uses the NDK toolchain
        #    instead of the host clang. Without these, host mach-o objects
        #    get bundled into the final .a and llvm-strip then rejects them.
        #    Done in shell so $ANDROID_NDK_HOME actually expands — the
        #    `${{ env.X }}` workflow context only sees workflow-declared env,
        #    not runner env, and resolves to empty for ANDROID_NDK_HOME.
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin"

          mkdir -p /tmp/ndk-shims
          for arch in aarch64-linux-android armv7-linux-androideabi arm-linux-androideabi i686-linux-android x86_64-linux-android; do
            for tool in ranlib ar nm as strip; do
              ln -sf "$NDK_BIN/llvm-$tool" "/tmp/ndk-shims/${arch}-${tool}"
            done
          done
          echo "/tmp/ndk-shims" >> "$GITHUB_PATH"
          echo "$NDK_BIN" >> "$GITHUB_PATH"

          # macOS ships Bash 3.2 (no associative arrays), so unrolled.
          emit_target() {
            local tgt="$1" tgt_upper="$2" clang="$3"
            {
              echo "CC_${tgt}=$NDK_BIN/$clang"
              echo "CXX_${tgt}=$NDK_BIN/${clang}++"
              echo "AR_${tgt}=$NDK_BIN/llvm-ar"
              echo "RANLIB_${tgt}=$NDK_BIN/llvm-ranlib"
              echo "CARGO_TARGET_${tgt_upper}_LINKER=$NDK_BIN/$clang"
            } >> "$GITHUB_ENV"
          }
          emit_target aarch64_linux_android      AARCH64_LINUX_ANDROID      aarch64-linux-android21-clang
          emit_target armv7_linux_androideabi    ARMV7_LINUX_ANDROIDEABI    armv7a-linux-androideabi21-clang
          emit_target i686_linux_android         I686_LINUX_ANDROID         i686-linux-android21-clang
          emit_target x86_64_linux_android       X86_64_LINUX_ANDROID       x86_64-linux-android21-clang

      - name: Install dependencies
        run: yarn install --immutable

      - name: Cross-compile all targets via craby
        run: yarn craby build
        env:
          # Setting profile.release.lto = false in Cargo.toml and
          # CARGO_PROFILE_RELEASE_LTO=false in env didn't actually stop cc-rs
          # from emitting LLVM bitcode for the C deps (libz-sys's adler32.o
          # came out as LLVM IR bitcode under all three). Some part of the
          # libz-sys / openssl-src / libtor-sys build chain is forcing -flto
          # regardless of Rust's profile.
          #
          # CFLAGS_<target> values get appended after cc-rs's own flags, so
          # `-fno-lto` lands after any `-flto` and clang honors the last one,
          # producing native object files that NDK's llvm-strip can handle.
          CARGO_PROFILE_RELEASE_LTO: "false"
          CFLAGS_aarch64_linux_android: "-fno-lto"
          CFLAGS_armv7_linux_androideabi: "-fno-lto"
          CFLAGS_i686_linux_android: "-fno-lto"
          CFLAGS_x86_64_linux_android: "-fno-lto"

      - name: Diagnose adler32.o source archive
        if: always()
        run: |
          set +e
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin"
          AR="$NDK_BIN/llvm-ar"
          TARGET_DIR="target/aarch64-linux-android/release"
          echo "=== Searching all .a archives for adler32.o membership ==="
          find target/aarch64-linux-android -name '*.a' 2>/dev/null | while read a; do
            if "$AR" t "$a" 2>/dev/null | grep -qE '^adler32(_simd)?\.o$'; then
              echo "HIT: $a"
              "$AR" t "$a" | grep adler
              echo
            fi
          done
          echo
          echo "=== libz-sys-* build out dir contents ==="
          for d in $(find "$TARGET_DIR/build" -maxdepth 1 -type d -name 'libz-sys-*' 2>/dev/null); do
            echo "-- $d --"
            find "$d" -maxdepth 4 -name '*.a' -o -name 'adler32*.o' 2>/dev/null
          done
          echo
          echo "=== libtor-sys-* / libtor-src-* / libevent-src-* / openssl-sys-* build out for any .a ==="
          for d in $(find "$TARGET_DIR/build" -maxdepth 1 -type d \( -name 'libtor-sys-*' -o -name 'libtor-src-*' -o -name 'libevent-src-*' -o -name 'openssl-sys-*' -o -name 'openssl-src-*' \) 2>/dev/null); do
            echo "-- $d --"
            find "$d" -maxdepth 6 -name '*.a' 2>/dev/null
          done

      - name: Upload Android prebuilts
        uses: actions/upload-artifact@v4
        with:
          name: android-prebuilts
          path: android/src/main/jni/libs/
          if-no-files-found: error

      - name: Upload iOS prebuilts
        uses: actions/upload-artifact@v4
        with:
          name: ios-prebuilts
          path: ios/framework/
          if-no-files-found: error
