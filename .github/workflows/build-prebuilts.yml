name: Build Prebuilts (ZeusLN fork)

on:
  workflow_dispatch:
  push:
    branches:
      - prebuilt-artifacts

jobs:
  # Single macos job — Apple Silicon runner can host both iOS and Android
  # cross-compiles (NDK ships an x86_64 toolchain that runs fine via Rosetta).
  # `yarn craby build` walks all 7 targets in one shot.
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install autotools (libtor / openssl-src vendored build deps)
        # macos-latest doesn't ship automake / autoconf / libtool / pkg-config,
        # but libtor-src's autogen.sh runs aclocal in its build script.
        run: brew install automake autoconf libtool pkg-config

      - name: Install Rust cross targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Set up NDK shims for legacy per-arch binutils names
        # NDK 23+ ships unified `llvm-ar` / `llvm-ranlib` etc., but the
        # vendored openssl autotools build inside libtor-sys still calls
        # the legacy per-arch names (e.g. `aarch64-linux-android-ranlib`).
        # Synthesize the wrappers via symlinks and prepend to PATH.
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin"
          mkdir -p /tmp/ndk-shims
          for arch in aarch64-linux-android armv7-linux-androideabi arm-linux-androideabi i686-linux-android x86_64-linux-android; do
            for tool in ranlib ar nm as strip; do
              ln -sf "$NDK_BIN/llvm-$tool" "/tmp/ndk-shims/${arch}-${tool}"
            done
          done
          echo "/tmp/ndk-shims" >> "$GITHUB_PATH"
          echo "$NDK_BIN" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Cross-compile all targets via craby
        run: yarn craby build
        env:
          # Force the `cc` crate (used by libz-sys / openssl-src / etc.) to
          # pick the Android NDK clang for each cross target. Without these
          # it falls back to the host compiler, which produces mach-o
          # objects that get bundled into the final Android .a archive and
          # then llvm-strip rejects them as "not a valid object file"
          # (this is what was happening with adler32.o from zlib).
          CC_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin/aarch64-linux-android21-clang
          CXX_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin/aarch64-linux-android21-clang++
          AR_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ar
          RANLIB_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ranlib
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin/aarch64-linux-android21-clang

          CC_armv7_linux_androideabi: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin/armv7a-linux-androideabi21-clang
          CXX_armv7_linux_androideabi: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin/armv7a-linux-androideabi21-clang++
          AR_armv7_linux_androideabi: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ar
          RANLIB_armv7_linux_androideabi: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ranlib
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin/armv7a-linux-androideabi21-clang

          CC_i686_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin/i686-linux-android21-clang
          CXX_i686_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin/i686-linux-android21-clang++
          AR_i686_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ar
          RANLIB_i686_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ranlib
          CARGO_TARGET_I686_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin/i686-linux-android21-clang

          CC_x86_64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin/x86_64-linux-android21-clang
          CXX_x86_64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin/x86_64-linux-android21-clang++
          AR_x86_64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ar
          RANLIB_x86_64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ranlib
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin/x86_64-linux-android21-clang

      - name: Upload Android prebuilts
        uses: actions/upload-artifact@v4
        with:
          name: android-prebuilts
          path: android/src/main/jni/libs/
          if-no-files-found: error

      - name: Upload iOS prebuilts
        uses: actions/upload-artifact@v4
        with:
          name: ios-prebuilts
          path: ios/framework/
          if-no-files-found: error
