name: Build Prebuilts (ZeusLN fork)

on:
  workflow_dispatch:
  push:
    branches:
      - prebuilt-artifacts

jobs:
  # Single macos job — Apple Silicon runner can host both iOS and Android
  # cross-compiles (NDK ships an x86_64 toolchain that runs fine via Rosetta).
  # `yarn craby build` walks all 7 targets in one shot.
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install autotools (libtor / openssl-src vendored build deps)
        # macos-latest doesn't ship automake / autoconf / libtool / pkg-config,
        # but libtor-src's autogen.sh runs aclocal in its build script.
        run: brew install automake autoconf libtool pkg-config

      - name: Install Rust cross targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Set up NDK shims and Android cross-compile env
        # 1) NDK 23+ ships unified `llvm-ar` / `llvm-ranlib` etc., but the
        #    vendored openssl autotools build inside libtor-sys still calls
        #    the legacy per-arch names (e.g. `aarch64-linux-android-ranlib`).
        #    Synthesize the wrappers via symlinks and prepend to PATH.
        # 2) Set CC/CXX/AR/RANLIB/linker env vars per Android target so the
        #    `cc` crate (libz-sys, openssl-src, etc.) uses the NDK toolchain
        #    instead of the host clang. Without these, host mach-o objects
        #    get bundled into the final .a and llvm-strip then rejects them.
        #    Done in shell so $ANDROID_NDK_HOME actually expands — the
        #    `${{ env.X }}` workflow context only sees workflow-declared env,
        #    not runner env, and resolves to empty for ANDROID_NDK_HOME.
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin"

          mkdir -p /tmp/ndk-shims
          for arch in aarch64-linux-android armv7-linux-androideabi arm-linux-androideabi i686-linux-android x86_64-linux-android; do
            for tool in ranlib ar nm as strip; do
              ln -sf "$NDK_BIN/llvm-$tool" "/tmp/ndk-shims/${arch}-${tool}"
            done
          done
          echo "/tmp/ndk-shims" >> "$GITHUB_PATH"
          echo "$NDK_BIN" >> "$GITHUB_PATH"

          declare -A clang_for=(
            [aarch64_linux_android]=aarch64-linux-android21-clang
            [armv7_linux_androideabi]=armv7a-linux-androideabi21-clang
            [i686_linux_android]=i686-linux-android21-clang
            [x86_64_linux_android]=x86_64-linux-android21-clang
          )
          for tgt in "${!clang_for[@]}"; do
            clang="${clang_for[$tgt]}"
            tgt_upper="$(echo "$tgt" | tr '[:lower:]' '[:upper:]')"
            {
              echo "CC_${tgt}=$NDK_BIN/$clang"
              echo "CXX_${tgt}=$NDK_BIN/${clang}++"
              echo "AR_${tgt}=$NDK_BIN/llvm-ar"
              echo "RANLIB_${tgt}=$NDK_BIN/llvm-ranlib"
              echo "CARGO_TARGET_${tgt_upper}_LINKER=$NDK_BIN/$clang"
            } >> "$GITHUB_ENV"
          done

      - name: Install dependencies
        run: yarn install --immutable

      - name: Cross-compile all targets via craby
        run: yarn craby build

      - name: Upload Android prebuilts
        uses: actions/upload-artifact@v4
        with:
          name: android-prebuilts
          path: android/src/main/jni/libs/
          if-no-files-found: error

      - name: Upload iOS prebuilts
        uses: actions/upload-artifact@v4
        with:
          name: ios-prebuilts
          path: ios/framework/
          if-no-files-found: error
