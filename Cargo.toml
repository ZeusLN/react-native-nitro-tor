[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"

[profile.release]
# Thin LTO threads the needle: full LTO embeds LLVM bitcode in cc-rs
# C objects which the NDK llvm-strip can't process; LTO off leaves
# cross-crate Rust calls as external relocations that on iOS/Xcode 26
# trip the Apple linker (`reloc 1: symbol index out of range` in the
# rustc-emitted .rcgu.o files). Thin LTO produces native ELF/Mach-O
# objects AND consolidates cross-crate references, so both downstream
# linkers stay happy.
lto = "thin"
codegen-units = 1
opt-level = "z"
strip = true
panic = "unwind"
