[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"

[profile.release]
# Default to fat LTO (matches upstream 0.5.3 and what Xcode 26's ld
# expects — with LTO off or thin, rustc emits a relocation form that
# Apple's linker rejects with "symbol index out of range" /
# `findRealAtom` / `cfiStartsArray` assertions inside the
# reactnativenitrotor.rcgu.o; otool confirms the difference is
# missing PAGE21/PAGOF12 and a synthetic type-15 reloc instead).
#
# Android builds must override this with CARGO_PROFILE_RELEASE_LTO=false
# at invocation time, because with fat LTO cc-rs bakes LLVM bitcode
# into libz-sys's adler32.o etc. and the NDK's llvm-strip can't
# process bitcode-laden archive members. See build script docs.
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "unwind"
