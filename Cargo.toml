[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"

[profile.release]
# lto disabled on this branch: NDK llvm-strip can't process the LLVM
# bitcode that cc-rs emits for C objects (libz-sys's adler32.o) under
# LTO, so craby's post-build strip step fails. CARGO_PROFILE_RELEASE_LTO
# in env doesn't propagate into cc-rs reliably; flipping it here is the
# minimum invasive fix for the prebuilt-artifacts build.
lto = false
codegen-units = 1
opt-level = "z"
strip = true
# panic = "abort" instead of "unwind": with LTO disabled, the duplicated
# CFI entries Rust emits across crates make Xcode 26's ld_prime hit
# `findRealAtom` and ld_classic hit `cfiStartsArray`. Aborting on panic
# drops the eh_frame tables Rust would otherwise generate, and the
# remaining compact-unwind metadata is what the Apple linker actually
# expects. Mobile apps panic-abort either way.
panic = "abort"
